name: Compile ESP8266 firmware

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP8266 core and library
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@3.0.0
          arduino-cli lib install PubSubClient
      - name: Compile Wemos D1 mini firmware
        run: arduino-cli compile --fqbn esp8266:esp8266:d1_mini firmware/velux_kli2mqtt
